name: DSH Next · Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsh-next-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'xue-ding-e/DSH-Next' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.28.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        run: |
          $base = node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version"
          $date = [DateTime]::UtcNow.ToString('yyyyMMdd')
          $prefix = node -e "import('./apps/desktop/scripts/desktop-build-version.mjs').then(m => process.stdout.write(m.desktopBuildVersionPrefix(process.argv[1])))" $base
          $version = "$prefix$date.$env:GITHUB_RUN_NUMBER"
          # electron-updater reads the release tag with /\/tag\/(v?[^/]+)$/ and requires semver.valid,
          # so only a plain "v<version>" tag reaches its version comparison. The channel is the
          # version's own prerelease field, which is the name electron-updater matches by equality.
          $channel = node -e "import('./apps/desktop/scripts/desktop-build-version.mjs').then(m => process.stdout.write(m.desktopBuildVersionChannel(process.argv[1])))" $version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "NEXT_VERSION=$version" >> $env:GITHUB_ENV
          "NEXT_TAG=v$version" >> $env:GITHUB_ENV
          "NEXT_CHANNEL=$channel" >> $env:GITHUB_ENV

      - name: Validate release build identity
        run: node --test apps/desktop/tests/desktop-build-identity.test.mjs

      - name: Build unsigned DSH Next installer
        run: pnpm run package:desktop:win:x64 -- --next --unsigned --build-version $env:NEXT_VERSION

      - name: Verify session log encoding
        run: pnpm exec vitest run packages/session/session-persistence-jsonl/tests/zstd.spec.ts

      - name: Verify session storage and workspace startup
        run: pnpm run test:expected apps/cli/tests/profiles/web/tests/session-artifact-startup.expected.e2e.ts

      - name: Verify release asset
        run: |
          $dir = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $installer = Join-Path $dir "dsh-next-$env:NEXT_VERSION-win-x64-unsigned.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "Missing $installer" }
          $client = (Get-Content -LiteralPath '.dsh-build/client-build-environment.json' -Raw | ConvertFrom-Json).environment
          if ($client.DSH_CLIENT_VERSION -ne $env:NEXT_VERSION -or $client.DSH_CLIENT_BUILD_VERSION -ne $env:NEXT_VERSION) {
            throw "Client build identity does not match release $env:NEXT_VERSION"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$(Split-Path -Leaf $installer)" | Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS') -Encoding utf8NoBOM
          $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($installer)))
          $size = (Get-Item -LiteralPath $installer).Length
          $name = Split-Path -Leaf $installer
          $manifest = @"
          version: $env:NEXT_VERSION
          files:
            - url: $name
              sha512: $sha512
              size: $size
          path: $name
          sha512: $sha512
          releaseDate: $([DateTime]::UtcNow.ToString('o'))
          "@
          # The channel feed is what the installed application requests. latest.yml is the fallback
          # electron-updater tries for any prerelease channel, so both carry the same build.
          $manifest | Set-Content -LiteralPath (Join-Path $dir "$env:NEXT_CHANNEL.yml") -Encoding utf8NoBOM
          $manifest | Set-Content -LiteralPath (Join-Path $dir 'latest.yml') -Encoding utf8NoBOM

      - name: Verify installed Next lifecycle
        run: |
          $dir = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $installer = (Resolve-Path -LiteralPath (Join-Path $dir "dsh-next-$env:NEXT_VERSION-win-x64-unsigned.exe")).ProviderPath
          apps/desktop/tests/next-installed-lifecycle.ps1 -Installer $installer -Version $env:NEXT_VERSION -OutputDirectory (Join-Path $env:RUNNER_TEMP 'next-installed-lifecycle')

      - name: Retain installed startup journals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: next-installed-startup
          path: ${{ runner.temp }}/next-installed-lifecycle/journal-*/*.jsonl
          if-no-files-found: ignore

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $installer = Join-Path $dir "dsh-next-$env:NEXT_VERSION-win-x64-unsigned.exe"
          gh release create $env:NEXT_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DSH Next $env:NEXT_VERSION" --draft --prerelease --notes "Automated DSH Next Windows x64 build from $env:GITHUB_SHA. The installer is unsigned; verify SHA256SUMS before installation."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $env:NEXT_TAG $installer (Join-Path $dir 'SHA256SUMS') (Join-Path $dir "$env:NEXT_CHANNEL.yml") (Join-Path $dir 'latest.yml') --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:NEXT_TAG --repo $env:GITHUB_REPOSITORY --draft=false
