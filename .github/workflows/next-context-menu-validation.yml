name: Next verified V2 lifecycle retry without rebuild

on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Full reviewed fixed-source build and lifecycle control commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: next-reviewed-heavy-validation
  cancel-in-progress: false
env:
  EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
  EXPECTED_PRODUCT_SHA: 6b9ebe026a565e5aa547811972dff745961e134f
  DSH_TELEMETRY_DISABLED: '1'
  DSH_SNAPSHOT: replay
  DSH_GATE_CONCURRENCY: '2'
  DSH_OXLINT_THREADS: '2'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  RAYON_NUM_THREADS: '2'
  DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
jobs:
  windows:
    if: github.repository == 'xue-ding-e/DSH-Next' && github.repository_id == '1437727533' && github.ref == 'refs/heads/validation/next-sidebar-lifecycle-reuse-20261030' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact reviewed controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: |
            .github/validation/next-installer
            .github/workflows
          persist-credentials: false
      - name: Checkout immutable baseline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 270dd45091805cb504fdd39bf09d9ec596ca4150
          path: baseline
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout exact fixed product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b9ebe026a565e5aa547811972dff745961e134f
          path: product
          fetch-depth: 7
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify controls and owned process helpers
        timeout-minutes: 5
        run: |
          if ($env:EXPECTED_CONTROL_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:GITHUB_SHA -cne $env:EXPECTED_CONTROL_SHA) { throw 'Unexpected control commit.' }
          $head = git -C control rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_CONTROL_SHA) { throw 'Checkout identity mismatch.' }
          foreach ($file in Get-ChildItem control/.github/validation/next-installer/*.ps1) {
            $tokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { throw ('PowerShell syntax check failed: ' + $file.Name) }
          }
          node --test control/.github/validation/next-installer/protocol-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Protocol control tests failed.' }
          python -B control/.github/validation/next-installer/verify-reuse.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Reuse verification tests failed.' }
          python -B control/.github/validation/next-installer/download-reuse.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Transport tests failed.' }
          python -B control/.github/validation/next-installer/workflow-tools.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Tool selection regression failed.' }
          python -B control/.github/validation/next-installer/verify-v2-reuse.test.py
          if ($LASTEXITCODE -ne 0) { throw 'V2 byte reuse regression failed.' }
          node --test control/.github/validation/next-installer/qualification.test.mjs control/.github/validation/next-installer/linux-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source identity regression failed.' }
          & control/.github/validation/next-installer/environment.test.ps1
          & control/.github/validation/next-installer/windows-owned-process.test.ps1
          & control/.github/validation/next-installer/windows-path-guard.test.ps1
      - name: Verify reviewed exact-source Linux prerequisite
        timeout-minutes: 2
        run: |
          node control/.github/validation/next-installer/linux-evidence.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Exact-source Linux prerequisite is not qualified.' }
      - name: Download fixed V1 and current verified V2 artifacts under native ownership
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . control/.github/validation/next-installer/windows-owned-process.ps1
          $evidence = Join-Path $env:RUNNER_TEMP 'dsh-reuse-transport-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $python = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          $gh = (Get-Command gh.exe -CommandType Application | Select-Object -First 1).Source
          $null = Invoke-NextOwnedProcess -FilePath $python -Arguments @('-B',(Join-Path $env:GITHUB_WORKSPACE 'control/.github/validation/next-installer/download-reuse.py'),'--gh',$gh,'--output',(Join-Path $env:RUNNER_TEMP 'dsh-reuse-download')) -WorkingDirectory $env:GITHUB_WORKSPACE -TimeoutSeconds 400 -EvidencePrefix (Join-Path $evidence 'transport')
          $null = Invoke-NextOwnedProcess -FilePath $python -Arguments @('-B',(Join-Path $env:GITHUB_WORKSPACE 'control/.github/validation/next-installer/download-v2-reuse.py'),'--gh',$gh,'--manifest',(Join-Path $env:GITHUB_WORKSPACE 'control/.github/validation/next-installer/v2-reuse-manifest.json'),'--output',(Join-Path $env:RUNNER_TEMP 'dsh-v2-reuse-download')) -WorkingDirectory $env:GITHUB_WORKSPACE -TimeoutSeconds 700 -EvidencePrefix (Join-Path $evidence 'v2-transport')
      - name: Verify archive identity and extract only reviewed installer inputs
        timeout-minutes: 5
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'dsh-reuse-download'
          python -B control/.github/validation/next-installer/verify-reuse.py --manifest control/.github/validation/next-installer/reuse-manifest.json --archive "$download/artifact.zip" --run "$download/run.json" --artifact "$download/artifact.json" --product baseline --output "$env:RUNNER_TEMP/dsh-reuse-installation"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed artifact verification failed; no installer may run.' }
      - name: Verify exact source and sealed existing V2 bytes without rebuilding
        timeout-minutes: 5
        run: |
          node control/.github/validation/next-installer/qualification.mjs identity product
          if ($LASTEXITCODE -ne 0) { throw 'Fixed source identity failed.' }
          python -B control/.github/validation/next-installer/verify-v2-reuse.py --manifest control/.github/validation/next-installer/v2-reuse-manifest.json --download "$env:RUNNER_TEMP/dsh-v2-reuse-download" --product product --baseline "$env:RUNNER_TEMP/dsh-reuse-installation" --output "$env:RUNNER_TEMP/dsh-next-installer-evidence/windows"
          if ($LASTEXITCODE -ne 0) { throw 'Existing V2 build bytes failed qualification; no installer may run.' }
      - name: Qualify actual installed launch upgrade repair uninstall and reinstall
        timeout-minutes: 25
        run: |
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Transport token must not reach installed application validation.' }
          $node = (Get-Command node.exe -CommandType Application | Select-Object -First 1).Source
          $nodeHash = (Get-FileHash -LiteralPath $node -Algorithm SHA256).Hash.ToLowerInvariant()
          & control/.github/validation/next-installer/windows-installer.ps1 -Product product -PackageIndex "$env:RUNNER_TEMP/dsh-next-installer-evidence/windows/packages.json" -NodeExe $node -ExpectedNodeSha256 $nodeHash
      - name: Retain synthetic qualification records without installers or profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: next-reused-v2-lifecycle-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dsh-next-installer-evidence/linux-dependency/reviewed-linux.json
            ${{ runner.temp }}/dsh-reuse-installation/*.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/*.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/runtime-*/protocol-runtime.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/runtime-*/protocol-before.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/runtime-*/protocol-after.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/runtime-*/node-identity.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/runtime-*/owned.result.json
            ${{ runner.temp }}/dsh-reuse-transport-evidence/*.result.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
