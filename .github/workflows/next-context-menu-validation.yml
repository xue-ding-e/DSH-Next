name: Next actual Windows installer qualification

# Manual-only existing entry, with an immutable successful Linux run as a prerequisite.
on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Full reviewed Windows qualification control SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: next-reviewed-heavy-validation
  cancel-in-progress: false
env:
  EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
  EXPECTED_PRODUCT_SHA: 53e4410684871bd94fbb532d314d1f0522937f30
  DSH_TELEMETRY_DISABLED: '1'
  DSH_SNAPSHOT: replay
  DSH_GATE_CONCURRENCY: '2'
  DSH_OXLINT_THREADS: '2'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  RAYON_NUM_THREADS: '2'
jobs:
  linux_qualification:
    if: github.repository == 'xue-ding-e/DSH-Next' && github.repository_id == '1437727533' && github.ref == 'refs/heads/validation/next-installer-windows-paths-20261029' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: |
            .github/validation/next-installer
            .github/workflows
          persist-credentials: false
      - name: Pinned Node for credential-free public evidence verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Check qualification controls and exact successful Linux prerequisite
        shell: bash
        timeout-minutes: 3
        run: |
          node --test control/.github/validation/next-installer/qualification.test.mjs control/.github/validation/next-installer/run-command-cancellation.test.mjs control/.github/validation/next-installer/linux-evidence.test.mjs control/.github/validation/next-installer/official-identity.test.mjs control/.github/validation/next-installer/windows-pe-identity.test.mjs
          node control/.github/validation/next-installer/linux-evidence.mjs
      - name: Retain immutable Linux dependency evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: next-linux-prerequisite-${{ github.run_id }}
          path: ${{ runner.temp }}/dsh-next-installer-evidence/linux-dependency/
          if-no-files-found: warn
          retention-days: 7
  windows:
    needs: linux_qualification
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact reviewed controls without persisted credentials
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: |
            .github/validation/next-installer
            .github/workflows
          persist-credentials: false
      - name: Set up pinned Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Test native job ownership and timeout cleanup before installing dependencies
        timeout-minutes: 3
        run: |
          & control/.github/validation/next-installer/windows-owned-process.test.ps1
          & control/.github/validation/next-installer/windows-path-guard.test.ps1
      - name: Checkout the exact same qualified product
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 53e4410684871bd94fbb532d314d1f0522937f30
          path: product
          fetch-depth: 4
          persist-credentials: false
      - name: Verify exact source and safe hosted environment
        timeout-minutes: 2
        run: |
          node control/.github/validation/next-installer/qualification.mjs identity product
          if ($LASTEXITCODE -ne 0) { throw 'Source identity gate failed.' }
          "PNPM_CONFIG_STORE_DIR=$env:RUNNER_TEMP\pnpm-store" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up pinned package manager without dependency cache
        timeout-minutes: 5
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.28.5
          run_install: false
          package_json_file: product/package.json
          dest: ${{ runner.temp }}/pnpm
      - name: Install frozen dependencies under the native owned-process budget
        timeout-minutes: 26
        run: '& control/.github/validation/next-installer/windows-qualify.ps1 -Product product -Mode install-dependencies'
      - name: Run native suites, both actual packages, and bounded synthetic-data silent lifecycle
        timeout-minutes: 310
        run: '& control/.github/validation/next-installer/windows-qualify.ps1 -Product product'
      - name: Retain small explicit synthetic evidence separately from installer bytes
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: next-windows-evidence-${{ github.run_id }}
          # These are generated identity/test/lifecycle records only, never profiles, environment files or installers.
          path: |
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/result.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/installer-result.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/packages.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/official-identity.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/pe-builder.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/package-v1-pe.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/package-v2-pe.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/desktop-tests.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/desktop-tests.json.skips.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/smoke-profile-tests.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/smoke-profile-tests.json.skips.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/next-source-tests.stdout.log
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/package-v1.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/package-v2.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/fresh-install-v1.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/real-upgrade-v2.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/same-version-repair.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/reinstall-final.json
            ${{ runner.temp }}/dsh-next-installer-evidence/windows/*.result.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
      - name: Retain only generated synthetic evidence and these actual unsigned installers
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: next-windows-installers-${{ github.run_id }}
          path: ${{ runner.temp }}/dsh-next-installer-evidence/windows/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
