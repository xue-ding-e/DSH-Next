name: Next queue recall locked-toolchain validation

on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Reviewed full SHA of this locked-validation control commit
        type: string
        required: true
      flutter_validation_run_id:
        description: Reviewed terminal Flutter Linux validation run
        type: string
        required: true
      flutter_expected_sha:
        description: Reviewed full Flutter source SHA
        type: string
        required: true
      magpie_run_id:
        description: Reviewed terminal Magpie full-CI run (must finish before dispatch)
        type: string
        required: true
      magpie_expected_sha:
        description: Reviewed full Magpie source SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: next-reviewed-heavy-validation
  cancel-in-progress: false
env:
  EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
  EXPECTED_PRODUCT_SHA: fd3e299df3c254fde54a4dc446563f1883913eeb
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_CONCURRENCY: '2'
  DSH_OXLINT_THREADS: '2'
  DSH_SNAPSHOT: replay
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  RAYON_NUM_THREADS: '2'
jobs:
  validate:
    if: github.repository == 'xue-ding-e/DSH-Next' && github.ref == 'refs/heads/validation/queue-recall-locked-validation-20261027' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout immutable validation controls
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: |
            .github/validation
            .github/workflows
          persist-credentials: false
      - name: Set up pinned Node without dependency cache
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Validate control gates without installing dependencies
        timeout-minutes: 2
        run: node --test control/.github/validation/stage2.test.mjs
      - name: Require terminal predecessors before allocation
        timeout-minutes: 5
        env:
          FLUTTER_VALIDATION_RUN_ID: ${{ inputs.flutter_validation_run_id }}
          FLUTTER_EXPECTED_SHA: ${{ inputs.flutter_expected_sha }}
          MAGPIE_RUN_ID: ${{ inputs.magpie_run_id }}
          MAGPIE_EXPECTED_SHA: ${{ inputs.magpie_expected_sha }}
        run: node control/.github/validation/heavy-queue.mjs
      - name: Checkout exact unvalidated product candidate and parent
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fd3e299df3c254fde54a4dc446563f1883913eeb
          path: product
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact reviewed source chain and range blobs before dependency scripts
        timeout-minutes: 2
        run: |
          node control/.github/validation/stage2.mjs product --identity-only
          test -z "$(git -C product status --porcelain)"
          test ! -e product/.env
          test -z "${DEEPSEEK_API_KEY:-}"
          test -z "${NPM_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
      - name: Set up locked package manager without install
        timeout-minutes: 5
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.28.5
          run_install: false
          package_json_file: product/package.json
          dest: ${{ runner.temp }}/pnpm
      - name: Install frozen dependencies with repository-approved allowBuilds
        working-directory: product
        timeout-minutes: 25
        run: pnpm install --frozen-lockfile
      - name: Run bounded real unit, Loader, artifact, aggregate and doc gates
        timeout-minutes: 270
        run: node control/.github/validation/stage2.mjs product
      - name: Upload only generated review evidence, never installation packages
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: queue-recall-locked-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/dsh-next-evidence/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
