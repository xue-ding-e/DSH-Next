name: Next installer source qualification

# Existing registered manual entry; no default-branch trigger and no publication.
on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Full reviewed SHA of this manual validation control commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: next-reviewed-heavy-validation
  cancel-in-progress: false
env:
  EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
  EXPECTED_PRODUCT_SHA: 51c24a29f50809bea71b0ce0b6f0550fe50bbd20
  DSH_TELEMETRY_DISABLED: '1'
  DSH_SNAPSHOT: replay
  DSH_GATE_CONCURRENCY: '2'
  DSH_OXLINT_THREADS: '2'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  RAYON_NUM_THREADS: '2'
jobs:
  linux:
    if: github.repository == 'xue-ding-e/DSH-Next' && github.repository_id == '1437727533' && github.ref == 'refs/heads/validation/next-installer-native-20261029' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout reviewed controls without persisted credentials
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: |
            .github/validation/next-installer
            .github/workflows
          persist-credentials: false
      - name: Set up frozen Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Test evidence gates and owned-process cancellation without dependencies
        timeout-minutes: 2
        run: node --test control/.github/validation/next-installer/qualification.test.mjs control/.github/validation/next-installer/run-command-cancellation.test.mjs
      - name: Checkout exact installer product and its pointer-qualified parent
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 51c24a29f50809bea71b0ce0b6f0550fe50bbd20
          path: product
          fetch-depth: 4
          persist-credentials: false
      - name: Verify repository, control, source, tree, exact 44-file scope, both two-file fixes and 59 reviewed file hashes
        timeout-minutes: 2
        run: |
          node control/.github/validation/next-installer/qualification.mjs identity product
          echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
      - name: Set up pinned package manager without installation
        timeout-minutes: 5
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.28.5
          run_install: false
          package_json_file: product/package.json
          dest: ${{ runner.temp }}/pnpm
      - name: Install frozen dependencies
        timeout-minutes: 25
        working-directory: product
        run: pnpm install --frozen-lockfile
      - name: Run actual Next source tests, Desktop suites, full TS6 build, paired docs and pointer regressions
        timeout-minutes: 260
        run: exec node control/.github/validation/next-installer/qualification.mjs linux product
      - name: Retain only generated source-qualification evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: next-installer-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/dsh-next-installer-evidence/linux/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
