name: Next desktop version declaration validation
# Validation-branch control only: never promote this file to main with the product fix.
on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Reviewed full SHA of this workflow control commit V
        type: string
        required: true
      expected_product_sha:
        description: Reviewed full SHA of declaration-only commit P, parent of V
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: next-reviewed-heavy-validation
  cancel-in-progress: false
env:
  EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
  EXPECTED_PRODUCT_SHA: ${{ inputs.expected_product_sha }}
  DSH_TELEMETRY_DISABLED: '1'
  DSH_SNAPSHOT: replay
  DSH_GATE_CONCURRENCY: '1'
jobs:
  validate:
    if: github.repository == 'xue-ding-e/DSH-Next' && github.ref == 'refs/heads/validation/desktop-build-version-channel' && github.event_name == 'workflow_dispatch' && github.sha == inputs.expected_control_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout immutable reviewed control
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout declaration-only product
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_product_sha }}
          path: product
          fetch-depth: 2
          persist-credentials: false
      - name: Set up pinned Node without caches
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.9.0
          package-manager-cache: false
      - name: Guard tests, exact graph, real physical and cgroup limits
        timeout-minutes: 2
        run: |
          node --test control/.github/validation/build-version-guard.test.mjs
          node control/.github/validation/build-version-guard.mjs control product
          test ! -e product/.env
          test -z "${DEEPSEEK_API_KEY:-}${NPM_TOKEN:-}${NODE_AUTH_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/dsh-evidence"
      - name: Set up pinned pnpm without installing
        timeout-minutes: 5
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.28.5
          run_install: false
          package_json_file: product/package.json
          dest: ${{ runner.temp }}/pnpm
      - name: Install frozen dependencies without secrets
        working-directory: product
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile
      - name: Generate official host contract prerequisites, without bundling
        working-directory: product
        timeout-minutes: 25
        run: timeout 1500 pnpm exec tsx scripts/compile-referenced-projects.ts host-contracts 2>&1 | tee "$RUNNER_TEMP/dsh-evidence/contracts.log"
      - name: Run official host aggregate helper with its original 8GiB heap argument
        working-directory: product
        timeout-minutes: 10
        run: |
          timeout 600 node --import tsx --input-type=module - <<'JS' 2>&1 | tee "$RUNNER_TEMP/dsh-evidence/host.log"
          import { aggregateCheckArgs } from './scripts/compile-referenced-projects.ts'
          import { spawnSync } from 'node:child_process'
          const args = aggregateCheckArgs('host')
          console.log('Official aggregate arguments:', JSON.stringify(args))
          const r = spawnSync(process.execPath, args, { stdio: 'inherit', timeout: 590000 })
          if (r.error || r.signal || r.status !== 0) process.exit(1)
          JS
      - name: Run original version tests with standard repository configuration
        working-directory: product
        timeout-minutes: 5
        run: |
          timeout 300 pnpm exec vitest run --project=thread-safe apps/desktop/tests/desktop-build-version.spec.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/dsh-evidence/version-tests.json"
          node ../control/.github/validation/build-version-guard.mjs tests "$RUNNER_TEMP/dsh-evidence/version-tests.json"
      - name: Retain only diagnostic and test evidence
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsh-version-declaration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dsh-evidence/
          if-no-files-found: warn
          retention-days: 7
