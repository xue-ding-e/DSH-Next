name: Next Windows configuration compatibility and check-only validation
# Phase D: old-created legitimate settings and sessions survive fixed manual upgrade.
# Existing formal update CHECK only, no download/install or feed changes.
on:
  push:
    branches: [validation/released-windows-lifecycle]
permissions:
  contents: read
concurrency:
  group: next-reviewed-heavy-validation
  cancel-in-progress: false
jobs:
  fixture:
    if: github.repository == 'xue-ding-e/DSH-Next' && github.ref == 'refs/heads/validation/released-windows-lifecycle' && github.event.before == 'c2cd1fcc322c04224a952cf736a71ea419e0c3ef' && github.event.after == github.sha && github.event.created == false && github.event.deleted == false && github.event.forced == false
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Verify exact source graph event and complete blob manifest
        shell: pwsh
        run: |
          node --input-type=module -e "import {run} from './.github/validation/native-windows/source-gate.mjs'; run(process.env,'9d59a8f21d2a983de33f7a061f7cd09477f1b952')"
          if ($LASTEXITCODE -ne 0) {throw 'Source/event identity gate failed'}
      - name: ASAR reader and actual CLI negative controls
        shell: pwsh
        run: |
          node --test .github/validation/native-windows/read-installed-identity.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'Identity regression failed'}
      - name: Parse compile and synthetic owned-process fixture only
        shell: pwsh
        run: .github/validation/native-windows/validate-native-fixture.ps1
      - name: Loopback endpoint policy negative controls
        shell: pwsh
        run: |
          node --test .github/validation/native-windows/native-ui/cdp-endpoint.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'Endpoint policy tests failed'}
      - name: Synthetic fixture identity and writer cleanup negative controls
        shell: pwsh
        run: |
          node --test .github/validation/native-windows/native-ui/synthetic-sessions.test.mjs .github/validation/native-windows/native-ui/compatibility-controls.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'Synthetic fixture regression failed'}
      - name: Parse and prove owned app plus probe cleanup with synthetic processes
        shell: pwsh
        run: .github/validation/native-windows/native-ui/validate-ui-fixture.ps1
      - name: Fixed old settings and sessions followed by manual new installer; independent public update checks
        shell: pwsh
        run: .github/validation/native-windows/native-ui/installed-ui-smoke.ps1 -Execute
      - name: Preserve synthetic lifecycle summary only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsh-config-and-check-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dsh-release-acceptance-*/retained-*.json
            ${{ runner.temp }}/dsh-release-acceptance-*/seed-report.json
            ${{ runner.temp }}/dsh-release-acceptance-*/renderer-*-report.json.compatibility.json
            ${{ runner.temp }}/dsh-release-acceptance-*/renderer-*-report.json.update-check.json
            ${{ runner.temp }}/dsh-release-acceptance-*/lifecycle-report.json
            ${{ runner.temp }}/dsh-release-acceptance-*/renderer-*-report.json
            ${{ runner.temp }}/dsh-release-acceptance-*/renderer-*-report.json.listener.json
          if-no-files-found: warn
          retention-days: 14
