name: Next Windows installed welcome renderer validation
# Phase C0: installed renderer welcome skip only.
# No session-menu, automatic update, or valid configuration migration claim.
on:
  push:
    branches: [validation/released-windows-lifecycle]
permissions:
  contents: read
concurrency:
  group: next-reviewed-heavy-validation
  cancel-in-progress: false
jobs:
  fixture:
    if: github.repository == 'xue-ding-e/DSH-Next' && github.ref == 'refs/heads/validation/released-windows-lifecycle' && github.event.before == '807bc292a77707e4fc0f15030cf61808ff9577a8' && github.event.after == github.sha && github.event.created == false && github.event.deleted == false && github.event.forced == false
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Verify exact source graph event and complete blob manifest
        shell: pwsh
        run: |
          node --input-type=module -e "import {run} from './.github/validation/native-windows/source-gate.mjs'; run(process.env,'9d59a8f21d2a983de33f7a061f7cd09477f1b952')"
          if ($LASTEXITCODE -ne 0) {throw 'Source/event identity gate failed'}
      - name: ASAR reader and actual CLI negative controls
        shell: pwsh
        run: |
          node --test .github/validation/native-windows/read-installed-identity.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'Identity regression failed'}
      - name: Parse compile and synthetic owned-process fixture only
        shell: pwsh
        run: .github/validation/native-windows/validate-native-fixture.ps1
      - name: Loopback endpoint policy negative controls
        shell: pwsh
        run: |
          node --test .github/validation/native-windows/native-ui/cdp-endpoint.test.mjs
          if ($LASTEXITCODE -ne 0) {throw 'Endpoint policy tests failed'}
      - name: Parse and prove owned app plus probe cleanup with synthetic processes
        shell: pwsh
        run: .github/validation/native-windows/native-ui/validate-ui-fixture.ps1
      - name: Fixed installed renderer and formal welcome skip only
        shell: pwsh
        run: .github/validation/native-windows/native-ui/installed-ui-smoke.ps1 -Execute
      - name: Preserve synthetic lifecycle summary only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dsh-installed-welcome-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dsh-release-acceptance-*/lifecycle-report.json
            ${{ runner.temp }}/dsh-release-acceptance-*/renderer-report.json
            ${{ runner.temp }}/dsh-release-acceptance-*/renderer-report.json.listener.json
          if-no-files-found: warn
          retention-days: 14
